baseURL: https://rsousa.co/

languageCode: en
title: "Ricardo G. Sousa's Blog"

# Manage languages
# For any more details, you can check the official documentation: https://gohugo.io/content-management/multilingual/
languages:
  en:
    languageCode: en
    languageName: English
    weight: 1

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      extras:
        footnote: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

outputs:
  home:
  - HTML
  - RSS
  - JSON

# Enable global emoji support
enableEmoji: true

module:
  imports:
  - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: images
      target: static/images

# Custom parameters
params:
  # background image of the landing page
  background: "images/site/background.jpg"

  # Provide logos for your site. The inverted logo will be used in the initial
  # transparent navbar and the main logo will be used in the non-transparent navbar.
  # It will be the default to the theme logos if not provided.
  logo:
    main: images/site/favicon.png
    inverted: images/site/favicon.png
    favicon: images/site/favicon.png

  # GitHub repo URL of your site
  gitRepo: https://github.com/rjgsousa

  features:
    comment:
      enable: false
      services:
        disqus:
          shortname: non-existent

    analytics:
      enable: true
      services:
        umami:
          scheme: https
          instance: cloud.umami.is
          id: 5eea7f3f-34e6-4e69-b7cf-97ceda354beb

    # Enable and configure blog posts
    blog:
      enable: true
      showAuthor: true # shows the author of post (defaults true)
      # Share post on different social media
      shareButtons:
        facebook: true
        twitter: true
        linkedin: true
        reddit: true
        whatsapp: true
        email: true
        # tumblr: true
        # pocket: true
        # diaspora: true
        mastodon: true

    # # Enable & configure "Notes" features
    # notes:
    #   enable: true
    
    # specify whether you want to show Table of Contents in reading page
    toc:
      enable: true

    # show tags under the post title
    tags:
      enable: true
      on_card: true 

    # Enable reading time support in post cards and in post pages
    readingTime:
      enable: false

  # Provide footer configuration.
  footer:
    enable: false

  # Provide newsletter configuration. This feature hasn't been implemented yet.
  # Currently, you can just hide it from the footer.
  # newsletter:
  #   enable: false

